name: Release Python SDK
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        type: boolean
        default: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "latest" }
      - name: Sync dependencies
        run: cd sdks/python && uv sync
      - name: Build
        run: cd sdks/python && uv build
      - name: Publish
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            cd sdks/python && uv publish
          else
            echo "Dry run: would publish vigil-sdk"
          fi
        env:
          UV_PYPI_TOKEN: ${{ secrets.UV_PYPI_TOKEN }}
