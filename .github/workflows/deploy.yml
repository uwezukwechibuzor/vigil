name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  packages: write
  id-token: write  # for OIDC cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & Sign Images ────────────────────────────────────────────────────
  build-sign:
    name: Build & Sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, collector, flightcheck, ingest, insights, alerts]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/vigil-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_PREFIX }}/vigil-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  # ── Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build-sign
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name vigil-staging --region us-east-1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run DB migrations
        run: |
          kubectl run vigil-migrate-$(date +%s) \
            --image=${{ env.IMAGE_PREFIX }}/vigil-migrate:sha-${{ github.sha }} \
            --restart=Never \
            --env="DATABASE_URL=$(kubectl get secret vigil-secrets -o jsonpath='{.data.DATABASE_URL}' | base64 -d)" \
            -- /vigil-migrate -direction=up
          kubectl wait --for=condition=complete job/vigil-migrate --timeout=120s || true

      - name: Helm upgrade staging
        run: |
          helm upgrade --install vigil deploy/k8s/vigil \
            --namespace vigil \
            --create-namespace \
            --values deploy/k8s/vigil/values.yaml \
            --values deploy/k8s/vigil/values-staging.yaml \
            --set global.image.tag=sha-${{ github.sha }} \
            --wait --timeout=5m \
            --atomic

      - name: Verify health
        run: |
          kubectl rollout status deployment/vigil-api -n vigil --timeout=120s
          kubectl rollout status deployment/vigil-flightcheck -n vigil --timeout=120s

  # ── Deploy to Prod (manual approval) ──────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod  # has required reviewer configured in GitHub
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name vigil-prod --region us-east-1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade prod
        run: |
          helm upgrade --install vigil deploy/k8s/vigil \
            --namespace vigil \
            --create-namespace \
            --values deploy/k8s/vigil/values.yaml \
            --values deploy/k8s/vigil/values-prod.yaml \
            --set global.image.tag=sha-${{ github.sha }} \
            --wait --timeout=10m \
            --atomic

      - name: Verify health
        run: |
          kubectl rollout status deployment/vigil-api -n vigil --timeout=300s
          kubectl rollout status deployment/vigil-flightcheck -n vigil --timeout=300s
