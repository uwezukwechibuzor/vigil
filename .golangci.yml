version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
    - unparam
    - dogsled
    - bodyclose
    - noctx
    - whitespace
  disable:
    - depguard

formatters:
  enable:
    - gofmt
    - goimports

formatters-settings:
  goimports:
    local-prefixes:
      - github.com/uwezukwechibuzor/vigil

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]

run:
  timeout: 5m
