[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-sdk"
version = "0.1.0"
description = "Vigil Python SDK — reliability layer for onchain AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["vigil"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
