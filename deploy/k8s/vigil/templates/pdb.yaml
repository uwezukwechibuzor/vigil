{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vigil.fullname" $ }}-{{ $svcName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "vigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vigil.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $svcName }}
{{- end }}
{{- end }}
