{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.fullname" $ }}-{{ $svcName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "vigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "vigil.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $svcName }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
