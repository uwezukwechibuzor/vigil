global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vigil-otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "vigil-api"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "vigil-collector"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "vigil-flightcheck"
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "vigil-ingest"
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: "vigil-insights"
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: "vigil-alerts"
    static_configs:
      - targets: ["host.docker.internal:8085"]
